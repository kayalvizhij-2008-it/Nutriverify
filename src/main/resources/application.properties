# NutriVerify - Development Configuration
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:nutriverifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
nutriverify.jwt.secret=myNutriVerifySecretKeyThatIsLongEnoughForHS256Algorithm2024AndBeyond!!
nutriverify.jwt.expiration-ms=86400000

# CORS
nutriverify.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Provider keys (optional - absent means dev/manual mode)
# AI_API_KEY=
# VISION_API_KEY=
# OCR_API_KEY=
# SPEECH_API_KEY=
# TTS_API_KEY=
