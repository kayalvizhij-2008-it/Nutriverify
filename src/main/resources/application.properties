# NutriVerify - Configuration
server.port=${PORT:8080}

# Database (Default H2 in dev, overridable by environment)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:nutriverifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
nutriverify.jwt.secret=${JWT_SECRET:${NUTRIVERIFY_JWT_SECRET:myNutriVerifySecretKeyThatIsLongEnoughForHS256Algorithm2024AndBeyond!!}}
nutriverify.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
nutriverify.cors.allowed-origins=${NUTRIVERIFY_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}}

# NutriVerify AI Provider Configuration
nutriverify.ai.enabled=${AI_ENABLED:true}
nutriverify.ai.provider=${AI_PROVIDER:openai}
nutriverify.ai.api-key=${AI_API_KEY:}
nutriverify.ai.model=${AI_MODEL:gpt-4o-mini}
nutriverify.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
nutriverify.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

# External Vision & Speech API Keys
nutriverify.ocr.api-key=${OCR_API_KEY:${VISION_API_KEY:}}
nutriverify.speech.api-key=${SPEECH_API_KEY:${TTS_API_KEY:}}
