# NutriVerify - Production PostgreSQL Configuration Profile
server.port=${PORT:8080}

# PostgreSQL Datasource
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

# HikariCP Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security & Console
spring.h2.console.enabled=false

# JWT Configuration
nutriverify.jwt.secret=${JWT_SECRET:${NUTRIVERIFY_JWT_SECRET}}
nutriverify.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - accepts comma-separated origins or wildcard
nutriverify.cors.allowed-origins=${NUTRIVERIFY_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:*}}

# AI & Multimodal Services
nutriverify.ai.enabled=${AI_ENABLED:true}
nutriverify.ai.provider=${AI_PROVIDER:openai}
nutriverify.ai.api-key=${AI_API_KEY:}
nutriverify.ai.model=${AI_MODEL:gpt-4o-mini}
nutriverify.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
nutriverify.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

# External Vision & OCR
nutriverify.ocr.api-key=${OCR_API_KEY:${VISION_API_KEY:}}
nutriverify.speech.api-key=${SPEECH_API_KEY:${TTS_API_KEY:}}
