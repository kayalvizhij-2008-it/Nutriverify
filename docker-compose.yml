version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriverify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriverify}
      POSTGRES_USER: ${POSTGRES_USER:-nutriverify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriverify_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutriverify} -d ${POSTGRES_DB:-nutriverify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutriverify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutriverify}
      DATABASE_USERNAME: ${POSTGRES_USER:-nutriverify}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nutriverify_secure_pwd_2026}
      JWT_SECRET: ${JWT_SECRET:-myNutriVerifyProductionSecretKeyMustBe32CharsLong!}
      NUTRIVERIFY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OCR_API_KEY: ${OCR_API_KEY:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: nutriverify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
