# NutriVerify - Test Configuration
server.port=0

# H2 In-Memory Database (isolated from dev)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 console in test
spring.h2.console.enabled=false

# JWT
nutriverify.jwt.secret=testSecretKeyForTestingOnlyThatIsLongEnoughForHS256!!
nutriverify.jwt.expiration-ms=3600000

nutriverify.cors.allowed-origins=http://localhost:5173
